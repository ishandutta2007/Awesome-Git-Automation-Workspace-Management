<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="gitOrangeGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f43f5e"/><stop offset="100%" stop-color="#f97316"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="blurBehind" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur stdDeviation="60"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-width=".8" d="M 40 0 L 0 0 0 40" opacity=".6"/><circle cx="40" cy="40" r="1.5" fill="#334155" opacity=".8"/></pattern></defs><style>@keyframes orbFloat1{0%{transform:translate(0,0) scale(1);opacity:.45}50%{transform:translate(50px,30px) scale(1.15);opacity:.7}}@keyframes orbFloat2{0%{transform:translate(0,0) scale(1);opacity:.4}50%{transform:translate(-40px,-25px) scale(1.2);opacity:.65}}@keyframes pulseBranch{0%{stroke-dashoffset:400}}@keyframes nodePulse{0%{r:5px;opacity:.8}50%{r:7.5px;opacity:1}}.font-sans{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:900;font-size:46px;letter-spacing:-.5px;fill:url(#titleGrad)}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8;letter-spacing:.2px}.tagline{font-weight:600;font-size:14px;fill:#38bdf8;letter-spacing:2.5px;text-transform:uppercase}.pill-text{font-weight:600;font-size:13px;fill:#e2e8f0}.orb-1{animation:orbFloat1 10s ease-in-out infinite}.orb-2{animation:orbFloat2 12s ease-in-out infinite}.git-branch-line{stroke-dasharray:12,6;animation:pulseBranch 18s linear infinite}.node-anim{animation:nodePulse 3s ease-in-out infinite}</style><rect width="100%" height="100%" fill="url(#bgGrad)"/><rect width="100%" height="100%" fill="url(#grid)"/><g filter="url(#blurBehind)" opacity=".6"><circle cx="220" cy="110" r="140" fill="#6366f1" class="orb-1"/><circle cx="980" cy="280" r="160" fill="#06b6d4" class="orb-2"/><circle cx="600" cy="350" r="120" fill="#ec4899" class="orb-1"/></g><g opacity=".35" transform="translate(0, 0)"><path fill="none" stroke="#6366f1" stroke-width="3" d="M 80 80 Q 300 80 500 130 T 920 130 T 1120 80" class="git-branch-line"/><path fill="none" stroke="#06b6d4" stroke-width="2.5" d="M 280 80 C 380 170 520 220 740 220 C 880 220 1000 150 1080 80" class="git-branch-line"/><path fill="none" stroke="#f43f5e" stroke-width="2.5" d="M 450 130 C 560 300 700 320 880 320 C 990 320 1060 220 1110 130" class="git-branch-line"/><circle cx="180" cy="80" r="6" fill="#38bdf8" class="node-anim"/><circle cx="340" cy="110" r="5" fill="#818cf8" class="node-anim" style="animation-delay:.6s"/><circle cx="500" cy="130" r="6" fill="#c084fc" class="node-anim" style="animation-delay:1.2s"/><circle cx="620" cy="220" r="5.5" fill="#06b6d4" class="node-anim" style="animation-delay:.9s"/><circle cx="740" cy="220" r="6" fill="#2dd4bf" class="node-anim" style="animation-delay:1.5s"/><circle cx="680" cy="320" r="6" fill="#f43f5e" class="node-anim" style="animation-delay:1.8s"/><circle cx="880" cy="320" r="5" fill="#fb923c" class="node-anim" style="animation-delay:.4s"/><circle cx="920" cy="130" r="6" fill="#a855f7" class="node-anim" style="animation-delay:2.1s"/><circle cx="1060" cy="80" r="6" fill="#38bdf8" class="node-anim" style="animation-delay:1.1s"/></g><g class="font-sans"><g text-anchor="middle" transform="translate(0, 0) translate(600, 75)"><rect width="380" height="34" x="-190" y="-18" fill="#0f172a" stroke="#334155" stroke-width="1.2" opacity=".95" rx="17"/><circle cx="-160" cy="-1" r="5" fill="#22c55e"/><text x="-144" y="4" class="tagline" text-anchor="start">CURATED DEVELOPER DIRECTORY</text></g><text x="600" y="152" class="title" filter="url(#glow)" text-anchor="middle" transform="translate(0, 0)">Git Automation &amp; Workspace Management</text><text x="600" y="196" class="subtitle" text-anchor="middle" transform="translate(0, 0)">Git Worktrees • Multi-Repo Orchestration • TUIs &amp; Virtual-Branch GUIs • CI/CD</text><g text-anchor="middle"><g transform="translate(0, 0) translate(600, 260) translate(-400, 0)"><rect width="185" height="42" x="0" y="0" fill="#1e293b" stroke="#3b82f6" stroke-width="1.3" opacity=".92" rx="21"/><circle cx="24" cy="21" r="7" fill="#3b82f6"/><text x="44" y="26" class="pill-text" text-anchor="start">🌲 Git Worktrees</text></g><g transform="translate(0, 0) translate(600, 260) translate(-200, 0)"><rect width="185" height="42" x="0" y="0" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.3" opacity=".92" rx="21"/><circle cx="24" cy="21" r="7" fill="#8b5cf6"/><text x="44" y="26" class="pill-text" text-anchor="start">📦 Multi-Repo / Poly</text></g><g transform="translate(0, 0) translate(600, 260) translate(0, 0)"><rect width="190" height="42" x="0" y="0" fill="#1e293b" stroke="#06b6d4" stroke-width="1.3" opacity=".92" rx="21"/><circle cx="24" cy="21" r="7" fill="#06b6d4"/><text x="44" y="26" class="pill-text" text-anchor="start">⚡ Fast Rust TUIs</text></g><g transform="translate(0, 0) translate(600, 260) translate(205, 0)"><rect width="195" height="42" x="0" y="0" fill="#1e293b" stroke="#ec4899" stroke-width="1.3" opacity=".92" rx="21"/><circle cx="24" cy="21" r="7" fill="#ec4899"/><text x="44" y="26" class="pill-text" text-anchor="start"