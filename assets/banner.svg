<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="gitOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="blurBehind" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6" />
      <circle cx="40" cy="40" r="1.5" fill="#334155" opacity="0.8" />
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 900; font-size: 46px; letter-spacing: -0.5px; fill: url(#titleGrad); }
    .subtitle { font-weight: 500; font-size: 20px; fill: #94a3b8; letter-spacing: 0.2px; }
    .tagline { font-weight: 600; font-size: 14px; fill: #38bdf8; letter-spacing: 2.5px; text-transform: uppercase; }
    .pill-text { font-weight: 600; font-size: 13px; fill: #e2e8f0; }

    /* Keyframe Animations */
    @keyframes orbFloat1 {
      0% { transform: translate(0px, 0px) scale(1); opacity: 0.45; }
      50% { transform: translate(50px, 30px) scale(1.15); opacity: 0.7; }
      100% { transform: translate(0px, 0px) scale(1); opacity: 0.45; }
    }
    @keyframes orbFloat2 {
      0% { transform: translate(0px, 0px) scale(1); opacity: 0.4; }
      50% { transform: translate(-40px, -25px) scale(1.2); opacity: 0.65; }
      100% { transform: translate(0px, 0px) scale(1); opacity: 0.4; }
    }
    @keyframes pulseBranch {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodePulse {
      0%, 100% { r: 5px; opacity: 0.8; }
      50% { r: 7.5px; opacity: 1; }
    }

    .orb-1 { animation: orbFloat1 10s ease-in-out infinite; }
    .orb-2 { animation: orbFloat2 12s ease-in-out infinite; }
    .git-branch-line {
      stroke-dasharray: 12, 6;
      animation: pulseBranch 18s linear infinite;
    }
    .node-anim {
      animation: nodePulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Animated Ambient Glow Orbs in Background -->
  <g filter="url(#blurBehind)" opacity="0.6">
    <circle class="orb-1" cx="220" cy="110" r="140" fill="#6366f1" />
    <circle class="orb-2" cx="980" cy="280" r="160" fill="#06b6d4" />
    <circle class="orb-1" cx="600" cy="350" r="120" fill="#ec4899" />
  </g>

  <!-- Dynamic Animated Git Worktree & Branch Graph (Background & Ambient) -->
  <g opacity="0.35" transform="translate(0, 0)">
    <!-- Main branch -->
    <path class="git-branch-line" d="M 80 80 Q 300 80 500 130 T 920 130 T 1120 80" fill="none" stroke="#6366f1" stroke-width="3" />
    <!-- Worktree feature branch 1 -->
    <path class="git-branch-line" d="M 280 80 C 380 170 520 220 740 220 C 880 220 1000 150 1080 80" fill="none" stroke="#06b6d4" stroke-width="2.5" />
    <!-- Worktree feature branch 2 -->
    <path class="git-branch-line" d="M 450 130 C 560 300 700 320 880 320 C 990 320 1060 220 1110 130" fill="none" stroke="#f43f5e" stroke-width="2.5" />

    <!-- Commit Nodes -->
    <circle class="node-anim" cx="180" cy="80" r="6" fill="#38bdf8" />
    <circle class="node-anim" cx="340" cy="110" r="5" fill="#818cf8" style="animation-delay: 0.6s;" />
    <circle class="node-anim" cx="500" cy="130" r="6" fill="#c084fc" style="animation-delay: 1.2s;" />
    <circle class="node-anim" cx="620" cy="220" r="5.5" fill="#06b6d4" style="animation-delay: 0.9s;" />
    <circle class="node-anim" cx="740" cy="220" r="6" fill="#2dd4bf" style="animation-delay: 1.5s;" />
    <circle class="node-anim" cx="680" cy="320" r="6" fill="#f43f5e" style="animation-delay: 1.8s;" />
    <circle class="node-anim" cx="880" cy="320" r="5" fill="#fb923c" style="animation-delay: 0.4s;" />
    <circle class="node-anim" cx="920" cy="130" r="6" fill="#a855f7" style="animation-delay: 2.1s;" />
    <circle class="node-anim" cx="1060" cy="80" r="6" fill="#38bdf8" style="animation-delay: 1.1s;" />
  </g>

  <!-- Foreground Content Container: Fully Crisp & Guaranteed Foreground Legibility -->
  <g class="font-sans" transform="translate(0, 0)">
    <!-- Top Micro Badge Tagline -->
    <g transform="translate(600, 75)" text-anchor="middle">
      <rect x="-190" y="-18" width="380" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.2" opacity="0.95" />
      <circle cx="-160" cy="-1" r="5" fill="#22c55e" />
      <text x="-144" y="4" class="tagline" text-anchor="start">CURATED DEVELOPER DIRECTORY</text>
    </g>

    <!-- Main Title (Never obscured) -->
    <text x="600" y="152" text-anchor="middle" class="title" filter="url(#glow)">Git Automation &amp; Workspace Management</text>

    <!-- Subtitle (Clear high-contrast foreground) -->
    <text x="600" y="196" text-anchor="middle" class="subtitle">Git Worktrees • Multi-Repo Orchestration • TUIs &amp; Virtual-Branch GUIs • CI/CD</text>

    <!-- Interactive / Dynamic Feature Badges in Foreground -->
    <g transform="translate(600, 260)" text-anchor="middle">
      <!-- Badge 1: Worktrees & Agents -->
      <g transform="translate(-400, 0)">
        <rect x="0" y="0" width="185" height="42" rx="21" fill="#1e293b" stroke="#3b82f6" stroke-width="1.3" opacity="0.92" />
        <circle cx="24" cy="21" r="7" fill="#3b82f6" />
        <text x="44" y="26" class="pill-text" text-anchor="start">🌲 Git Worktrees</text>
      </g>

      <!-- Badge 2: Multi-Repo Orchestration -->
      <g transform="translate(-200, 0)">
        <rect x="0" y="0" width="185" height="42" rx="21" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.3" opacity="0.92" />
        <circle cx="24" cy="21" r="7" fill="#8b5cf6" />
        <text x="44" y="26" class="pill-text" text-anchor="start">📦 Multi-Repo / Poly</text>
      </g>

      <!-- Badge 3: Terminal TUIs & GUIs -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="190" height="42" rx="21" fill="#1e293b" stroke="#06b6d4" stroke-width="1.3" opacity="0.92" />
        <circle cx="24" cy="21" r="7" fill="#06b6d4" />
        <text x="44" y="26" class="pill-text" text-anchor="start">⚡ Fast Rust TUIs</text>
      </g>

      <!-- Badge 4: Virtual Branches -->
      <g transform="translate(205, 0)">
        <rect x="0" y="0" width="195" height="42" rx="21" fill="#1e293b" stroke="#ec4899" stroke-width="1.3" opacity="0.92" />
        <circle cx="24" cy="21" r="7" fill="#ec4899" />
        <text x="44" y="26" class="pill-text" text-anchor="start">🌿 Virtual Branches</text>
      </g>
    </g>

    <!-- Bottom Secondary Metrics Bar -->
    <g transform="translate(600, 350)" text-anchor="middle">
      <rect x="-310" y="-16" width="620" height="32" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="1" opacity="0.95" />
      <text x="0" y="5" font-size="13" font-weight="500" fill="#64748b" class="font-sans">
        🚀 Open Source &amp; Enterprise Platforms • 2026 Edition • Real-Time Stargazer Rankings
      </text>
    </g>
  </g>
</svg>
